<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Dodge</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060f; color: #dfe6ff; font-family: system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; margin: 0 auto; background: radial-gradient(circle at 50% 50%, #10143a, #05060f 70%); max-width: 100vw; max-height: 100vh; }
</style>
</head>
<body>
<canvas id="c" width="800" height="800"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, CX = W / 2, CY = H / 2;
const PLANET_R = 50, ORBIT_R = 130, SHIP_R = 9, GRAZE_DIST = 16;
let popups = [], graze = 0, lives = 3, invuln = 0;

let state = 'title', angle = -Math.PI / 2, dir = 1, asteroids = [], score = 0, spawnT = 0, elapsed = 0, shake = 0;
let best = 0;
try { best = +localStorage.getItem('orbitDodgeBest') || 0; } catch (e) {}
const stars = Array.from({ length: 80 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.5 + 0.3 }));
let particles = [];

function reset() {
  angle = -Math.PI / 2; dir = 1; asteroids = []; particles = [];
  score = 0; spawnT = 0; elapsed = 0; shake = 0; popups = []; graze = 0; lives = 3; invuln = 0; state = 'play';
}

// Controls: space / click / tap reverses direction; left/right arrows set direction.
function flip() {
  if (state === 'play') dir *= -1;
  else if (state === 'title' || state === 'over') reset();
}
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); flip(); }
  else if (e.code === 'ArrowLeft') { if (state === 'play') dir = -1; else flip(); }
  else if (e.code === 'ArrowRight') { if (state === 'play') dir = 1; else flip(); }
});
cv.addEventListener('pointerdown', flip);

function spawn() {
  const a = Math.random() * Math.PI * 2, d = 480;
  const x = CX + Math.cos(a) * d, y = CY + Math.sin(a) * d;
  // aim near the orbit ring, with some jitter so they're not perfectly predictable
  const ta = angle + (Math.random() - 0.5) * 2.2;
  const tx = CX + Math.cos(ta) * ORBIT_R, ty = CY + Math.sin(ta) * ORBIT_R;
  const speed = 110 + Math.min(elapsed * 4, 160) + Math.random() * 50;
  const len = Math.hypot(tx - x, ty - y);
  asteroids.push({ x, y, vx: (tx - x) / len * speed, vy: (ty - y) / len * speed, r: 10 + Math.random() * 12, rot: Math.random() * 6, spin: (Math.random() - 0.5) * 3 });
}

function boom(x, y) {
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * 6.28, s = 40 + Math.random() * 220;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1 });
  }
}

function update(dt) {
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  shake = Math.max(0, shake - dt * 30);
  graze = Math.max(0, graze - dt * 4);
  invuln = Math.max(0, invuln - dt);
  for (const p of popups) { p.y -= 40 * dt; p.life -= dt * 1.2; }
  popups = popups.filter(p => p.life > 0);
  if (state !== 'play') return;

  elapsed += dt; score += dt;
  const angSpeed = 2.1 + Math.min(elapsed * 0.02, 1.2);
  angle += dir * angSpeed * dt;

  spawnT -= dt;
  if (spawnT <= 0) { spawn(); spawnT = Math.max(0.35, 1.1 - elapsed * 0.012); }

  const sx = CX + Math.cos(angle) * ORBIT_R, sy = CY + Math.sin(angle) * ORBIT_R;
  for (const a of asteroids) {
    a.x += a.vx * dt; a.y += a.vy * dt; a.rot += a.spin * dt;
    const dist = Math.hypot(a.x - sx, a.y - sy);
    if (invuln > 0) continue;
    if (dist < a.r + SHIP_R - 2) {
      boom(sx, sy); shake = 12;
      if (lives > 0) {
        lives--; invuln = 1.5; a.dead = true;
      } else {
        state = 'over';
        if (score > best) { best = score; try { localStorage.setItem('orbitDodgeBest', best); } catch (e) {} }
      }
    } else if (!a.grazed && dist < a.r + SHIP_R + GRAZE_DIST) {
      // near miss: closer pass = bigger bonus
      a.grazed = true;
      const tight = 1 - (dist - (a.r + SHIP_R)) / GRAZE_DIST;
      const bonus = tight > 0.66 ? 2 : 1;
      score += bonus; graze = 1;
      popups.push({ x: sx, y: sy - 14, text: '+' + bonus + (bonus > 1 ? ' CLOSE!' : ''), life: 1 });
    }
  }
  // asteroids that hit the planet or leave far away vanish
  asteroids = asteroids.filter(a => !a.dead && Math.hypot(a.x - CX, a.y - CY) > PLANET_R + a.r * 0.5 && Math.hypot(a.x - CX, a.y - CY) < 700);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  ctx.fillStyle = '#fff';
  for (const s of stars) { ctx.globalAlpha = 0.3 + s.s / 3; ctx.fillRect(s.x, s.y, s.s, s.s); }
  ctx.globalAlpha = 1;

  // orbit ring
  ctx.strokeStyle = 'rgba(140,160,255,.18)'; ctx.setLineDash([4, 8]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(CX, CY, ORBIT_R, 0, 7); ctx.stroke(); ctx.setLineDash([]);

  // planet
  const g = ctx.createRadialGradient(CX - 15, CY - 15, 5, CX, CY, PLANET_R);
  g.addColorStop(0, '#6fd6ff'); g.addColorStop(1, '#2846a8');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(CX, CY, PLANET_R, 0, 7); ctx.fill();

  // asteroids
  for (const a of asteroids) {
    ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.rot);
    ctx.fillStyle = '#8a7f74'; ctx.strokeStyle = '#c9bcae'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 7; i++) {
      const t = i / 7 * 6.283, r = a.r * (0.8 + 0.2 * Math.sin(i * 12.9 + a.r));
      ctx.lineTo(Math.cos(t) * r, Math.sin(t) * r);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  }

  // ship
  if (state === 'play' && (invuln <= 0 || Math.floor(invuln * 12) % 2 === 0)) {
    const sx = CX + Math.cos(angle) * ORBIT_R, sy = CY + Math.sin(angle) * ORBIT_R;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(angle + (dir > 0 ? Math.PI : 0));
    ctx.fillStyle = '#ffd166'; ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(SHIP_R, 0); ctx.lineTo(-SHIP_R, -SHIP_R * 0.8); ctx.lineTo(-SHIP_R, SHIP_R * 0.8); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // particles
  ctx.fillStyle = '#ffb347';
  for (const p of particles) { ctx.globalAlpha = Math.max(p.life, 0); ctx.fillRect(p.x, p.y, 3, 3); }
  ctx.globalAlpha = 1;

  // near-miss popups and ring flash
  if (graze > 0) {
    ctx.strokeStyle = '#ffd166'; ctx.globalAlpha = graze * 0.6; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(CX, CY, ORBIT_R, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
  }
  ctx.font = 'bold 20px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = '#ffd166';
  for (const p of popups) { ctx.globalAlpha = Math.max(p.life, 0); ctx.fillText(p.text, p.x, p.y); }
  ctx.globalAlpha = 1;
  ctx.restore();

  // HUD
  ctx.fillStyle = '#dfe6ff'; ctx.font = '20px system-ui'; ctx.textAlign = 'left';
  ctx.fillText('Score ' + score.toFixed(1), 20, 34);
  ctx.textAlign = 'right'; ctx.font = '16px system-ui'; ctx.fillText('Best ' + best.toFixed(1), W - 20, 66);
  // hearts, top right
  ctx.font = '24px system-ui';
  for (let i = 0; i < 3; i++) {
    const filled = state === 'title' || i < lives;
    ctx.fillStyle = filled ? '#ff4d6d' : 'rgba(255,255,255,.2)';
    ctx.fillText(filled ? '♥' : '♡', W - 20 - i * 30, 34);
  }
  ctx.fillStyle = '#dfe6ff';

  ctx.textAlign = 'center';
  if (state === 'title') {
    ctx.font = 'bold 56px system-ui'; ctx.fillText('ORBIT DODGE', CX, 190);
    ctx.font = '20px system-ui';
    ctx.fillText('Space / click reverses your orbit. Arrow keys set direction.', CX, 610);
    ctx.fillText('Skim past asteroids for bonus points!', CX, 640);
    ctx.fillText('Press Space or click to start', CX, 675);
  } else if (state === 'over') {
    ctx.font = 'bold 48px system-ui'; ctx.fillText('CRASHED', CX, 190);
    ctx.font = '22px system-ui'; ctx.fillText('Survived ' + score.toFixed(1) + 's', CX, 230);
    ctx.fillText('Press Space or click to retry', CX, 660);
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  update(dt); draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
